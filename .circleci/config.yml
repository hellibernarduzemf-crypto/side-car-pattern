version: 2.1

jobs:
  email_cli:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create @ now
          command: |
            mkdir -p /tmp/poetry
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=500 2>/dev/null | sha256sum > /tmp/poetry/2015-03-13T19-26; true
            echo "stage=DEV_STAGE_1 hash=$(md5sum /tmp/poetry/2015-03-13T19-26 | cut -c1-8) size=$(wc -c </tmp/poetry/2015-03-13T19-26)"
      - persist_to_workspace:
          root: /tmp/poetry
          paths:
            - '2015-03-13T19-26'
  DEV_STAGE_1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/poetry
      - run:
          name: Audit gate output
          command: |
            sort --version-sort /tmp/poetry/2015-03-13T19-26 2>/dev/null | tail -1 | wc -c || true
      - run:
          name: Get source tree
          command: git clone --depth 3 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar -I gzip -xf output.tgz
      - run:
          command: cmake --version
      - run:
          name: Store metadata
          command: sleep 60
      - run:
          name: Workspace summary
          command: cat /proc/cpuinfo | head -5
      - run:
          command: exec ./driver
